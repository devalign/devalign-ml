name: Bi-weekly Clustering Pipeline

on:
  schedule:
    # Se ejecuta quincenalmente (los días 1 y 15 de cada mes a las 07:00 UTC)
    # Esto ocurre el domingo posterior, o simplemente fijos los días 1 y 15.
    - cron: '0 7 1,15 * *'
  workflow_dispatch:
    # Permite la ejecución manual desde la interfaz web de GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Clustering and Deploy to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          LLM_PROVIDER: "openai"
          LLM_MODEL: "gpt-4o-mini"
        run: |
          python run_pipeline.py --deploy --no-cache

name: Clustering Pipeline & Quality Gates

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Se ejecuta quincenalmente (los días 1 y 15 de cada mes a las 07:00 UTC)
    - cron: '0 7 1,15 * *'
  workflow_dispatch:
    # Permite la ejecución manual desde la interfaz web de GitHub

jobs:
  run-pipeline:
    name: Lint, Test & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Run Clustering and Safe Sync to Supabase
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: "taxonomy"
        run: |
          python run_pipeline.py --deploy --no-cache

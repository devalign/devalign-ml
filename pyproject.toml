[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "data",
    "models",
    "notebooks",
    "scripts",
    "validation",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "W291", "W293", "F401", "F841"]
